name: Update card data

# The browser can't call 17lands or Scryfall (no CORS headers), so the data is
# fetched and merged here and committed as files the app reads from its own origin.
# Sets are built once and kept, only ACTIVE ones are rebuilt, since finished sets
# no longer change and rebuilding them would bloat the repo history.
on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:
    inputs:
      refresh_all:
        description: 'Rebuild every set, not just the active ones'
        type: boolean
        default: false

# Needed because the job commits the data back to the repo
permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      # Sets still being drafted, rebuilt on every run
      ACTIVE: 'OTJ DFT'
      REFRESH_ALL: ${{ inputs.refresh_all }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/build_data.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add web/data
          git diff --staged --quiet || git commit -m "Update card data"
          git push